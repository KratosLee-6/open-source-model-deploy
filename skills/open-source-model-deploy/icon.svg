  <text x="32" y="232" font-family="ui-monospace, Consolas, monospace" font-size="11" font-weight="500" letter-spacing="1" fill="#0A0A0A">DEPLOY</text>
  <text x="224" y="232" text-anchor="end" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#002FA7">v1.0.2 · 2026-09-26</text>
