<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 背景 · 米白 -->
  <rect width="256" height="256" fill="#FAFAF8"/>
  <!-- 顶部蓝条 -->
  <rect x="0" y="0" width="256" height="10" fill="#002FA7"/>
  <!-- 装饰网格 (右上) -->
  <g opacity="0.05">
    <line x1="156" y1="10" x2="156" y2="100" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="180" y1="10" x2="180" y2="100" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="204" y1="10" x2="204" y2="100" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="228" y1="10" x2="228" y2="100" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="252" y1="10" x2="252" y2="100" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="156" y1="34" x2="256" y2="34" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="156" y1="58" x2="256" y2="58" stroke="#0A0A0A" stroke-width="1"/>
    <line x1="156" y1="82" x2="256" y2="82" stroke="#0A0A0A" stroke-width="1"/>
  </g>
  <!-- 顶部副标 · mono -->
  <text x="32" y="40" font-family="ui-monospace, Consolas, monospace" font-size="14" font-weight="600" letter-spacing="1.5" fill="#002FA7">OS TOOL · v1.0.2</text>

  <!-- 中间主体：大数字 127 -->
  <text x="128" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-size="100" font-weight="200" fill="#0A0A0A" letter-spacing="-2">127</text>

  <!-- 大数字下方 sub -->
  <text x="128" y="184" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="500" fill="#0A0A0A" letter-spacing="1">开源模型</text>

  <!-- 副标 2 -->
  <text x="128" y="208" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#737373" letter-spacing="0.5">94 → 127 · +33% · 自动补模型</text>

  <!-- 中间分隔线 -->
  <line x1="32" y1="172" x2="224" y2="172" stroke="#002FA7" stroke-width="2"/>

  <!-- 底部三联 -->
  <text x="64" y="218" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#002FA7">CLI</text>
  <text x="128" y="218" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#002FA7">MCP</text>
  <text x="192" y="218" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#002FA7">HTTP</text>

