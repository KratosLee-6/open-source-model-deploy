name: refresh-models

# 每周一 UTC 00:00（北京时间 8:00）自动跑
# 修复：GitHub 通知 Node 20 弃用 → 显式 pin Node 24（actions/... 自动选 Node24，但显式声明避免歧义）

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write      # 自动 commit + push 数据快照

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PY_VERSION: "3.12"
      NODE_VERSION: "24"   # ← GitHub Actions 2025-09-19 弃用通知：actions/* 强制 Node 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          node-version: ${{ env.NODE_VERSION }}    # 显式 pin 24 (上 GH 日志警告)
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_VERSION }}
          node-version: ${{ env.NODE_VERSION }}    # setup-python v5 接受 node-version

      - name: Setup Node (显式 24 · 防 GH 弃用通知)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Refresh HF metadata (已自动扩展到当前 KNOWN_MODELS · v1.0.2 = 127 模型)
        run: |
          echo "=== 拉取 KNOWN_MODELS 全部模型 ($(python -c 'from core.model_resolver import KNOWN_MODELS; print(len(KNOWN_MODELS))') 个) 的最新 HF 元数据 ==="
          python scripts/refresh_hf_metadata.py \
            --refresh-bare-repos \
            --ensure-existing-in-known \
            --internal-check \
              || echo "refresh_hf_metadata exit=$?"

      - name: Refresh GPU prices
        run: |
          echo "=== 刷 GPU 价格（5 款 NVIDIA） ==="
          python scripts/refresh_gpu_prices.py || echo "refresh_gpu_prices exit=$?"

      - name: Generate deployment recommendations
        run: |
          echo "=== 生成部署建议报告 ==="
          python scripts/auto_expand_models.py --mode=recommend \
            --target=consumer-gpu \
            --output=references/deployment-recommendations.md \
            || echo "auto_expand_models exit=$?"

      - name: Commit + push data snapshots
        run: |
          # ── 分支守卫 ────────────────────────────────────────────────
          # 修复：workflow_dispatch 可以在 tag / 其它分支 ref 上触发，此时
          # checkout 出来是 detached HEAD，`git push origin main` 会直接失败
          # （v1.0.2 tag 上的 run 36242701036 就是这么挂的，步骤「自动 commit
          # 变更」红叉，而数据其实已经刷好了、artifact 也传上去了）。
          # 策略：数据刷新照跑，artifact 照传，但不往 main 推不该推的东西。
          HEAD_REF="$(git symbolic-ref --quiet --short HEAD || true)"
          if [ "$HEAD_REF" != "main" ]; then
            echo "⚠ HEAD 不在 main（当前: ${HEAD_REF:-detached HEAD @ $(git rev-parse --short HEAD)}）"
            echo "⚠ 本次只刷新数据并上传 artifact，跳过 commit + push（数据不会丢）"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$HEAD_REF"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): 自动刷新 HF 元数据 + GPU 价格 + 部署建议报告

            触发: schedule main
            时间: $(date -u '+%Y-%m-%d %H:%M UTC')
            HF 元数据: KNOWN_MODELS 全部 ($(python -c 'from core.model_resolver import KNOWN_MODELS; print(len(KNOWN_MODELS))') 个) 自动拉
            GPU 价格: 5 款 NVIDIA

            Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
            git push origin "$HEAD_REF"
            echo "✓ pushed"
          else
            echo "✓ 无变化，跳过 commit"
          fi

      - name: Upload artifacts (v4 · Node 24 兼容)
        uses: actions/upload-artifact@v4
        with:
          name: refresh-data-${{ github.run_id }}
          path: |
            data/
            references/
          retention-days: 14
